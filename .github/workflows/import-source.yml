name: Apply HMS customization

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/overlay/**'
      - '.github/workflows/import-source.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild and apply customization patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/overlay/part* > /tmp/overlay.b64
          base64 -d /tmp/overlay.b64 | gzip -d > /tmp/hms_overlay.patch
          git apply --check /tmp/hms_overlay.patch
          git apply /tmp/hms_overlay.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Customization already applied"
            exit 0
          fi
          git commit -m "Apply customized HMS-KET build"
          git push
